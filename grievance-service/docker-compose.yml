services:
  postgres:
    image: postgres:15-alpine
    container_name: grievance-postgres
    environment:
      POSTGRES_USER: postgres1
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: grievanceDb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    networks:
      - db-network

volumes:
  postgres-data:
  pgadmin-data:

networks:
  db-network:
    driver: bridge