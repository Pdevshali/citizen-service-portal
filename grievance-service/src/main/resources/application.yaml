server:
  port: 8085

spring:
  application:
    name: grievance-service

  cloud:
    config:
      enabled: false    # No Config Server in this project — use local application.yml

  datasource:
    url: jdbc:postgresql://localhost:5438/grievanceDb
    username: postgres1
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:39092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3
        enable.idempotence: true
        spring.json.add.type.headers: false

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: grievance-service-group
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.pdev.grievance_service.kafka.events,com.pdev.citizen_service.kafka.events,com.pdev.document_service.kafka.events,com.pdev.notification_service.kafka.events"
        spring.json.add.type.headers: false
        spring.json.value.default.type: com.pdev.grievance_service.kafka.events.GrievanceSubmittedEvent

    listener:
      ack-mode: RECORD
      concurrency: 2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # URL of your Eureka server
    register-with-eureka: true      # register this service
    fetch-registry: true            # also fetch the registry (for future Feign calls)
  instance:
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    com.pdev.grievance_service: DEBUG
    org.springframework.kafka: INFO

