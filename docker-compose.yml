# ═══════════════════════════════════════════════════════════════════════════════
# Citizen Services Portal — Docker Compose
# Usage:
#   docker compose up -d                 # start all services
#   docker compose up -d eureka-server   # start a single service
#   docker compose logs -f citizen-service
# ═══════════════════════════════════════════════════════════════════════════════

name: citizen-services-portal

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres-citizen:
    image: postgres:16-alpine
    container_name: postgres-citizen
    environment:
      POSTGRES_DB: citizenDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "5433:5432"
    volumes:
      - postgres-citizen-data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres1} -d citizenDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-document:
    image: postgres:16-alpine
    container_name: postgres-document
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: ${POSTGRES_USER:-postgres1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "5434:5432"
    volumes:
      - postgres-document-data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres1} -d documentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-certificate:
    image: postgres:16-alpine
    container_name: postgres-certificate
    environment:
      POSTGRES_DB: certificateDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "5435:5432"
    volumes:
      - postgres-certificate-data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres1} -d certificateDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notificationDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "5436:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres1} -d notificationDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-ekyc:
    image: postgres:16-alpine
    container_name: postgres-ekyc
    environment:
      POSTGRES_DB: kycSessionDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "5437:5432"
    volumes:
      - postgres-ekyc-data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres1} -d kycSessionDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-grievance:
    image: postgres:16-alpine
    container_name: postgres-grievance
    environment:
      POSTGRES_DB: grievanceDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "5438:5432"
    volumes:
      - postgres-grievance-data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres1} -d grievanceDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "39092:39092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:39092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8180/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Service Registry ─────────────────────────────────────────────────────────

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    image: citizen-portal/eureka-server:latest
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Backend Microservices ────────────────────────────────────────────────────

  citizen-service:
    build:
      context: ./citizen-service
      dockerfile: Dockerfile
    container_name: citizen-service
    image: citizen-portal/citizen-service:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-citizen:5432/citizenDb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres1}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-citizen:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-net

  ekyc-service:
    build:
      context: ./ekyc-service
      dockerfile: Dockerfile
    container_name: ekyc-service
    image: citizen-portal/ekyc-service:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ekyc:5432/kycSessionDb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres1}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-ekyc:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-net

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: document-service
    image: citizen-portal/document-service:latest
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-document:5432/documentdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres1}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-document:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-net

  certificate-service:
    build:
      context: ./certificate-service
      dockerfile: Dockerfile
    container_name: certificate-service
    image: citizen-portal/certificate-service:latest
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-certificate:5432/certificateDb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres1}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-certificate:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-net

  grievance-service:
    build:
      context: ./grievance-service
      dockerfile: Dockerfile
    container_name: grievance-service
    image: citizen-portal/grievance-service:latest
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-grievance:5432/grievanceDb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres1}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-grievance:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-net

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    image: citizen-portal/notification-service:latest
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notificationDb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres1}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-net

  # ─── API Gateway ──────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gatway
      dockerfile: Dockerfile
    container_name: api-gateway
    image: citizen-portal/api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8180/realms/citizen-portal}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - microservices-net

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    image: citizen-portal/frontend:latest
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - microservices-net

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  microservices-net:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-citizen-data:
  postgres-document-data:
  postgres-certificate-data:
  postgres-notification-data:
  postgres-ekyc-data:
  postgres-grievance-data:
