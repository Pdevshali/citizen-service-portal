services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "39092:39092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # KAFKA_LISTENERS tells the broker what interfaces/ports to BIND to.
      # PLAINTEXT binds to all interfaces on 39092 (accessible from host via localhost:39092).
      # PLAINTEXT_INTERNAL binds to all interfaces on 29092 (used by services inside docker network).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:39092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:39092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic kyc.verification.completed --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic kyc.initiation.event --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic grievance.submitted --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic document.fetch.requested --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic certificate.issuance.requested --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification.send --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - app-network

  # ─── Keycloak Identity Provider ───────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command: start-dev
    environment:
      # Admin credentials — loaded from .env file (gitignored)
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Use PostgreSQL for persistent realm/user data
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # HTTP config
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8180"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8180/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Microservice PostgreSQL Databases ────────────────────────────────────────
  # Each service has its own isolated DB on a different host port.
  # Port mapping: host_port:container_port
  # Your application.yml default URLs match these host ports exactly.

  postgres-citizen:
    image: postgres:16-alpine
    container_name: postgres-citizen
    environment:
      POSTGRES_DB: citizenDb
      POSTGRES_USER: postgres1
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"       # citizen-service connects to localhost:5433
    volumes:
      - pg-citizen-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres1 -d citizenDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-ekyc:
    image: postgres:16-alpine
    container_name: postgres-ekyc
    environment:
      POSTGRES_DB: kycSessionDb
      POSTGRES_USER: postgres1
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5437:5432"       # ekyc-service connects to localhost:5437
    volumes:
      - pg-ekyc-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres1 -d kycSessionDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-document:
    image: postgres:16-alpine
    container_name: postgres-document
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: postgres1
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5434:5432"       # document-service connects to localhost:5434
    volumes:
      - pg-document-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres1 -d documentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-certificate:
    image: postgres:16-alpine
    container_name: postgres-certificate
    environment:
      POSTGRES_DB: certificateDb
      POSTGRES_USER: postgres1
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5435:5432"       # certificate-service connects to localhost:5435
    volumes:
      - pg-certificate-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres1 -d certificateDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notificationDb
      POSTGRES_USER: postgres1
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5436:5432"       # notification-service connects to localhost:5436
    volumes:
      - pg-notification-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres1 -d notificationDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-grievance:
    image: postgres:16-alpine
    container_name: postgres-grievance
    environment:
      POSTGRES_DB: grievanceDb
      POSTGRES_USER: postgres1
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5438:5432"       # grievance-service connects to localhost:5438
    volumes:
      - pg-grievance-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres1 -d grievanceDb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  keycloak-db-data:
  pg-citizen-data:
  pg-ekyc-data:
  pg-document-data:
  pg-certificate-data:
  pg-notification-data:
  pg-grievance-data:

networks:
  app-network:
    driver: bridge
