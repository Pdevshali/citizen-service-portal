server:
  port: 8082

spring:
  application:
    name: ekyc-service

  datasource:
    url: jdbc:postgresql://localhost:5432/kycSessionDb
    username: postgres1
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3
        enable.idempotence: true
        spring.json.add.type.headers: false

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: ekyc-service-group
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.pdev.ekyc_service.kafka.events,com.pdev.citizen_service.kafka.events"
        spring.json.add.type.headers: false
        spring.json.value.default.type: com.pdev.ekyc_service.kafka.events.KycInitiationEvent

    listener:
      ack-mode: RECORD
      concurrency: 2

feign:
  client:
    config:
      citizen-service:
        url: http://localhost:8081