server:
  port: 8083

spring:
  application:
    name: document-service

  datasource:
    url: jdbc:postgresql://localhost:5434/documentdb
    username: postgres1
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:39092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: document-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.pdev.citizen_service.kafka.events,com.pdev.document_service.kafka.events"
        spring.json.add.type.headers: false
        spring.json.value.default.type: com.pdev.document_service.kafka.events.DocumentFetchRequestedEvent

    listener:
      ack-mode: RECORD
      concurrency: 2


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # URL of your Eureka server
    register-with-eureka: true      # register this service
    fetch-registry: true            # also fetch the registry (for future Feign calls)
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

logging:
  level:
    com.pdev.document_service: DEBUG
    org.springframework.kafka: INFO
