server:
  port: 8081

spring:
  application:
    name: citizen-service

  datasource:
    url: jdbc:postgresql://localhost:5433/citizenDb
    username: postgres1
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3
        enable.idempotence: true
        spring.json.add.type.headers: false

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: citizen-service-group
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.pdev.citizen_service.kafka.events,com.pdev.document_service.kafka.events"
        spring.json.add.type.headers: false
        spring.json.value.default.type: com.pdev.citizen_service.kafka.events.KycCompletedEvent

    listener:
      ack-mode: RECORD
      concurrency: 2

logging:
  level:
    com.pdev.citizen_service: DEBUG
    org.springframework.kafka: INFO